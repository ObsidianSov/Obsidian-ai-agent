# Osogbo RainCast AI - Inference Configuration
# ============================================

# Model Configuration
model:
  checkpoint_path: "checkpoints/best.pt"
  C_in: 8
  C_hidden: 64
  T_in: 12
  T_out: 6
  H: 81
  W: 81

# Data Configuration
data:
  # ERA5 data source
  era5_dir: "data/raw/era5"
  
  # GPM/CHIRPS data source  
  rainfall_dir: "data/raw/gpm"
  
  # Output directory for forecasts
  output_dir: "data/forecasts"

# Input Variables (same as training)
input_variables:
  - tp    # Total precipitation
  - 2t    # 2m temperature
  - 2d    # 2m dewpoint
  - u10   # 10m u-wind
  - v10   # 10m v-wind
  - sp    # Surface pressure
  - tcwv  # Total column water vapor
  - cape  # Convective available potential energy

# Output Configuration
output:
  # Save formats
  save_netcdf: true
  save_json: true
  
  # Forecast metadata
  model_version: "v1.0.0"
  
  # Grid bounds
  lat_min: 4.0
  lat_max: 8.0
  lon_min: 2.0
  lon_max: 6.0

# Inference Settings
inference:
  device: "cuda"  # cuda, cpu, mps
  batch_size: 1
  
  # Number of recent hours to fetch
  lookback_hours: 12

# API Server Configuration
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  
  # Forecast cache directory
  forecast_dir: "data/forecasts/latest"
